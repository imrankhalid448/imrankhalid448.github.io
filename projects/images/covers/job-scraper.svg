<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Job Scraper &amp; Outreach — AI Agents &amp; Automation</title>
  <desc id="desc">Cover art for the Job Scraper &amp; Outreach project by Imran Khalid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050510"/>
      <stop offset=".55" stop-color="#08081a"/>
      <stop offset="1" stop-color="#0d0b24"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#10b981" stop-opacity=".38"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981" stop-opacity="0"/>
      <stop offset=".5" stop-color="#10b981"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#10b981" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="930" cy="320" r="330" fill="url(#glow)"/>
  <circle cx="930" cy="320" r="330" fill="none" stroke="#10b981" stroke-opacity=".12" stroke-width="1"/>
  <path d="M0 610H1200" stroke="url(#line)" stroke-opacity=".45"/>

  <g opacity=".9">
    
        <g fill="none" stroke="#10b981" stroke-width="2" opacity=".55">
          <circle cx="800" cy="260" r="38"/><circle cx="1010" cy="230" r="30"/>
          <circle cx="940" cy="400" r="42"/><circle cx="760" cy="405" r="26"/>
          <path d="M833 280l142-30M825 285l88 92M962 383l-176 12M786 380l20-86"/>
          <path d="M800 222v-34M1010 200v-26M940 358v-30M760 431v26" opacity=".5"/>
        </g>
        <g fill="#10b981">
          <circle cx="800" cy="260" r="8"/><circle cx="1010" cy="230" r="7"/>
          <circle cx="940" cy="400" r="8"/><circle cx="760" cy="405" r="6"/>
        </g>
  </g>

  <g transform="translate(70 62)">
    <rect width="132" height="36" rx="18" fill="#10b981" fill-opacity=".08" stroke="#10b981" stroke-opacity=".55"/>
    <circle cx="20" cy="18" r="4" fill="#10b981"/>
    <text x="34" y="23" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2.5" fill="#10b981">AI / ML</text>
  </g>

  <text x="70" y="470" font-family="Poppins, Inter, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1" fill="#ffffff">Job Scraper &amp; Outreach</text>
  <text x="72" y="522" font-family="Inter, Arial, sans-serif" font-size="19" letter-spacing="3.4" fill="#10b981" opacity=".92">AI AGENTS &amp; AUTOMATION</text>
  <text x="72" y="660" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#9a9ab0">IMRAN KHALID · AI &amp; ML SPECIALIST</text>

  <g transform="translate(1005 618)">
    <circle r="38" fill="#050510" fill-opacity=".65" stroke="#10b981" stroke-opacity=".45"/>
    <path d="M0-18v36M-18 0h36" stroke="#10b981" stroke-width="2" stroke-opacity=".8"/>
    <circle r="7" fill="#10b981"/>
  </g>
</svg>