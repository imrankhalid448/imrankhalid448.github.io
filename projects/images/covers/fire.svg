<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Fire Detection System — Computer Vision</title>
  <desc id="desc">Cover art for the Fire Detection System project by Imran Khalid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050510"/>
      <stop offset=".55" stop-color="#08081a"/>
      <stop offset="1" stop-color="#0d0b24"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#00f3ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#00f3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00f3ff"/>
      <stop offset="1" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#00f3ff" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="930" cy="320" r="330" fill="url(#glow)"/>
  <circle cx="930" cy="320" r="330" fill="none" stroke="#00f3ff" stroke-opacity=".12" stroke-width="1"/>
  <path d="M0 610H1200" stroke="url(#line)" stroke-opacity=".45"/>

  <g opacity=".9">
    
        <g fill="none" stroke="#00f3ff" stroke-width="2" opacity=".6">
          <path d="M760 210h-50v50M1040 210h50v50M760 450h-50v-50M1040 450h50v-50"/>
          <rect x="840" y="260" width="120" height="140" rx="4" stroke-width="2.5"/>
          <rect x="905" y="300" width="140" height="120" rx="4" opacity=".55"/>
          <circle cx="900" cy="330" r="175" stroke-dasharray="4 12" opacity=".25"/>
        </g>
        <g fill="#00f3ff" opacity=".75">
          <rect x="840" y="252" width="46" height="6" rx="3"/>
          <rect x="905" y="292" width="40" height="5" rx="2.5" opacity=".55"/>
        </g>
  </g>

  <g transform="translate(70 62)">
    <rect width="132" height="36" rx="18" fill="#00f3ff" fill-opacity=".08" stroke="#00f3ff" stroke-opacity=".55"/>
    <circle cx="20" cy="18" r="4" fill="#00f3ff"/>
    <text x="34" y="23" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2.5" fill="#00f3ff">AI / ML</text>
  </g>

  <text x="70" y="470" font-family="Poppins, Inter, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1" fill="#ffffff">Fire Detection System</text>
  <text x="72" y="522" font-family="Inter, Arial, sans-serif" font-size="19" letter-spacing="3.4" fill="#00f3ff" opacity=".92">COMPUTER VISION</text>
  <text x="72" y="660" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#9a9ab0">IMRAN KHALID · AI &amp; ML SPECIALIST</text>

  <g transform="translate(1005 618)">
    <circle r="38" fill="#050510" fill-opacity=".65" stroke="#00f3ff" stroke-opacity=".45"/>
    <path d="M0-18v36M-18 0h36" stroke="#00f3ff" stroke-width="2" stroke-opacity=".8"/>
    <circle r="7" fill="#00f3ff"/>
  </g>
</svg>