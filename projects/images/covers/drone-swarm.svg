<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Drone Swarm Rescue — Autonomous Systems</title>
  <desc id="desc">Cover art for the Drone Swarm Rescue project by Imran Khalid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050510"/>
      <stop offset=".55" stop-color="#08081a"/>
      <stop offset="1" stop-color="#0d0b24"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".38"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#f59e0b" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="930" cy="320" r="330" fill="url(#glow)"/>
  <circle cx="930" cy="320" r="330" fill="none" stroke="#f59e0b" stroke-opacity=".12" stroke-width="1"/>
  <path d="M0 610H1200" stroke="url(#line)" stroke-opacity=".45"/>

  <g opacity=".9">
    
        <g fill="none" stroke="#f59e0b" stroke-width="2" opacity=".55">
          <path d="M700 420c70-150 140-190 220-150s120 40 190-70" stroke-dasharray="6 10"/>
          <path d="M720 250c90 30 130 100 210 110s120-40 170-100" stroke-dasharray="6 10" opacity=".5"/>
          <path d="M740 390l38-22 38 22-38 22zM930 260l30-18 30 18-30 18zM1000 210l26-15 26 15-26 15z"/>
        </g>
        <g fill="#f59e0b" opacity=".75">
          <circle cx="740" cy="390" r="4"/><circle cx="930" cy="260" r="4"/><circle cx="1000" cy="210" r="4"/>
        </g>
  </g>

  <g transform="translate(70 62)">
    <rect width="132" height="36" rx="18" fill="#f59e0b" fill-opacity=".08" stroke="#f59e0b" stroke-opacity=".55"/>
    <circle cx="20" cy="18" r="4" fill="#f59e0b"/>
    <text x="34" y="23" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2.5" fill="#f59e0b">AI / ML</text>
  </g>

  <text x="70" y="470" font-family="Poppins, Inter, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1" fill="#ffffff">Drone Swarm Rescue</text>
  <text x="72" y="522" font-family="Inter, Arial, sans-serif" font-size="19" letter-spacing="3.4" fill="#f59e0b" opacity=".92">AUTONOMOUS SYSTEMS</text>
  <text x="72" y="660" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#9a9ab0">IMRAN KHALID · AI &amp; ML SPECIALIST</text>

  <g transform="translate(1005 618)">
    <circle r="38" fill="#050510" fill-opacity=".65" stroke="#f59e0b" stroke-opacity=".45"/>
    <path d="M0-18v36M-18 0h36" stroke="#f59e0b" stroke-width="2" stroke-opacity=".8"/>
    <circle r="7" fill="#f59e0b"/>
  </g>
</svg>