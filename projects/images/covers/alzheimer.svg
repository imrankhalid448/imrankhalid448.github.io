<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Alzheimer's Detection — Medical AI &amp; Healthcare</title>
  <desc id="desc">Cover art for the Alzheimer's Detection project by Imran Khalid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050510"/>
      <stop offset=".55" stop-color="#08081a"/>
      <stop offset="1" stop-color="#0d0b24"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff6b6b" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ff6b6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#ff6b6b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ff6b6b" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="930" cy="320" r="330" fill="url(#glow)"/>
  <circle cx="930" cy="320" r="330" fill="none" stroke="#ff6b6b" stroke-opacity=".12" stroke-width="1"/>
  <path d="M0 610H1200" stroke="url(#line)" stroke-opacity=".45"/>

  <g opacity=".9">
    
        <g fill="none" stroke="#ff6b6b" stroke-width="2" opacity=".65">
          <circle cx="900" cy="330" r="150" opacity=".35"/>
          <circle cx="900" cy="330" r="105" opacity=".5"/>
          <circle cx="900" cy="330" r="60" opacity=".7"/>
          <path d="M720 330h70l22-58 34 116 26-72 18 14h70" stroke-width="3"/>
          <path d="M900 210v240M780 330h240" opacity=".25"/>
        </g>
        <g fill="#ff6b6b" opacity=".8">
          <circle cx="790" cy="272" r="4"/><circle cx="1012" cy="390" r="4"/>
          <circle cx="955" cy="222" r="3"/><circle cx="845" cy="430" r="3"/>
        </g>
  </g>

  <g transform="translate(70 62)">
    <rect width="132" height="36" rx="18" fill="#ff6b6b" fill-opacity=".08" stroke="#ff6b6b" stroke-opacity=".55"/>
    <circle cx="20" cy="18" r="4" fill="#ff6b6b"/>
    <text x="34" y="23" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2.5" fill="#ff6b6b">AI / ML</text>
  </g>

  <text x="70" y="470" font-family="Poppins, Inter, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1" fill="#ffffff">Alzheimer's Detection</text>
  <text x="72" y="522" font-family="Inter, Arial, sans-serif" font-size="19" letter-spacing="3.4" fill="#ff6b6b" opacity=".92">MEDICAL AI &amp; HEALTHCARE</text>
  <text x="72" y="660" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#9a9ab0">IMRAN KHALID · AI &amp; ML SPECIALIST</text>

  <g transform="translate(1005 618)">
    <circle r="38" fill="#050510" fill-opacity=".65" stroke="#ff6b6b" stroke-opacity=".45"/>
    <path d="M0-18v36M-18 0h36" stroke="#ff6b6b" stroke-width="2" stroke-opacity=".8"/>
    <circle r="7" fill="#ff6b6b"/>
  </g>
</svg>